name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag (e.g. v26.3.0-1); leave empty for a test build"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  wine:
    # Wine for macOS is x86_64-only (Apple Silicon runs it under Rosetta), so the build
    # needs an Intel runner, where Homebrew installs x86_64 dependencies.
    runs-on: macos-15-intel
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          brew install bison flex pkgconf gettext mingw-w64 freetype gnutls sdl2 molten-vk
          # No vulkan-loader on purpose: configure then links MoltenVK directly, like CrossOver.
          brew uninstall --ignore-dependencies vulkan-loader 2>/dev/null || true

      - name: Build
        env:
          ADEGA_WINE_VERSION: ${{ inputs.release != '' && inputs.release || format('dev-{0}', github.run_number) }}
        run: ./scripts/build.sh

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            work/build/configure.log
            work/build/make.log
            work/build/include/config.h
          if-no-files-found: ignore

      - name: Package
        uses: actions/upload-artifact@v4
        with:
          name: adega-wine
          path: out/*

      - name: Release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release }}" out/* --target "${{ github.sha }}" \
            --title "${{ inputs.release }}" --notes "CrossOver $(sed -n 's/^CX_VERSION=//p' scripts/build.sh) + patches deste repositório. SHA-256: $(cut -d' ' -f1 out/*.sha256)"
